<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Hệ thống Nông Sản</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .login-container {
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #1e293b; padding: 40px; border-radius: 20px;
            width: 350px; border: 1px solid #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }
        .login-card h2 { text-align: center; color: #10b981; margin-bottom: 30px; }
        .login-card input {
            width: 100%; padding: 12px; margin-bottom: 20px;
            background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px;
        }
        .btn-login {
            width: 100%; background: #10b981; color: white; border: none;
            padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2><i class="fas fa-user-shield"></i> ĐĂNG NHẬP</h2>
            <input type="text" id="maNV" placeholder="Mã nhân viên (VD: NV01)">
            <input type="password" id="password" placeholder="Mật khẩu">
            <button class="btn-login" onclick="handleLogin()">VÀO HỆ THỐNG</button>
            <p id="error-msg" style="color: #f87171; text-align: center; margin-top: 15px; display: none;"></p>
        </div>
    </div>

    <script>
        async function handleLogin() {
            const maNV = document.getElementById('maNV').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const response = await fetch('https://demo-xo8t.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ maNV, password })
                });

                if (response.ok) {
                    const user = await response.json();
                    // Lưu thông tin vào LocalStorage để dùng ở các trang sau
                    localStorage.setItem('user', JSON.stringify(user));
                    window.location.href = 'index.html'; // Chuyển vào trang chủ
                } else {
                    errorMsg.innerText = "Sai mã nhân viên hoặc mật khẩu!";
                    errorMsg.style.display = 'block';
                }
            } catch (e) {
                alert("Lỗi kết nối server!");
            }
        }
    </script>
</body>
</html>
