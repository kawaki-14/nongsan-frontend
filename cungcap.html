<script>
    const currentUser = JSON.parse(localStorage.getItem('user'));
    const apiCC = "https://demo-xo8t.onrender.com/api/cungcap";

    // Hàm chạy ngay khi load trang
    window.onload = function() {
        // 1. Hiển thị thông tin User
        if (currentUser) {
            document.getElementById('display-name').innerText = currentUser.hoTen;
            document.getElementById('display-role').innerText = currentUser.chucVu;
        } else {
            window.location.href = 'login.html';
        }

        // 2. Tự động nạp dữ liệu bảng lịch sử
        loadData();

        // 3. Tự động nạp danh sách vào các ô chọn (Modal)
        loadDropdowns();
    };

    function logout() {
        if(confirm("Bro chắc chắn muốn thoát?")) {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
    }

    async function loadData() {
        const tbody = document.getElementById('cc-content');
        try {
            const res = await fetch(`${apiCC}/all`);
            const data = await res.json();
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td><b>${item.maNCC}</b></td>
                    <td>${item.maNS}</td>
                    <td class="text-green">+ ${item.soLuongCC}</td>
                    <td>${item.ngayCC}</td>
                    <td>
                        <button class="action-btn delete" onclick="deleteItem('${item.maNCC}', '${item.maNS}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>`).join('');
        } catch (e) {
            console.error("Lỗi tải bảng cung cấp", e);
        }
    }

    async function loadDropdowns() {
        try {
            const [resNCC, resNS] = await Promise.all([
                fetch("https://demo-xo8t.onrender.com/api/nhacungcap/all"),
                fetch("https://demo-xo8t.onrender.com/api/nongsan/all")
            ]);
            const nccs = await resNCC.json();
            const nss = await resNS.json();
            
            document.getElementById('selectNCC').innerHTML = nccs.map(n => `<option value="${n.maNCC}">${n.tenNCC}</option>`).join('');
            document.getElementById('selectNS').innerHTML = nss.map(s => `<option value="${s.maNS}">${s.tenNS}</option>`).join('');
        } catch (e) {
            console.error("Lỗi nạp dropdown", e);
        }
    }

    // Các hàm saveCungCap, deleteItem, openModal, closeModal giữ nguyên...
</script>
