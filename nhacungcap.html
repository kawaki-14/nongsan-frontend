<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AGRI-ADMIN - Nhà Cung Cấp</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <nav class="side-nav">
            <div class="nav-logo"><i class="fas fa-seedling"></i><span>AGRI-ADMIN</span></div>
            <a href="index.html"><i class="fas fa-leaf"></i> Nông Sản</a>
            <a href="nhacungcap.html" class="active"><i class="fas fa-truck"></i> Nhà Cung Cấp</a>
            <a href="cungcap.html"><i class="fas fa-clipboard-list"></i> Nhập Hàng</a>
            <a href="#"><i class="fas fa-users"></i> Nhân Viên</a>
        </nav>

        <main>
            <header>
                <div class="header-main"><h1>NHÀ CUNG CẤP</h1><p>Quản lý đối tác chiến lược</p></div>
                <div class="user-info-bar">
                    <div class="user-details"><span class="user-name" id="display-name">---</span></div>
                    <button class="btn-logout" onclick="logout()"><i class="fas fa-power-off"></i></button>
                </div>
            </header>

            <div class="control-panel">
                <button onclick="loadData()"><i class="fas fa-sync-alt"></i> Làm mới</button>
                <button onclick="openModal()"><i class="fas fa-plus-circle"></i> Thêm NCC</button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Mã NCC</th><th>Tên Nhà Cung Cấp</th><th>Địa Chỉ</th><th>Loại Hình</th><th>Thao tác</th></tr></thead>
                    <tbody id="ncc-content"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const apiBase = "https://demo-xo8t.onrender.com/api/nhacungcap";
        window.onload = () => {
            document.getElementById('display-name').innerText = currentUser.hoTen;
            loadData();
        };
        async function loadData() {
            const res = await fetch(`${apiBase}/all`);
            const data = await res.json();
            document.getElementById('ncc-content').innerHTML = data.map(item => `
                <tr>
                    <td><span class="badge">${item.maNCC}</span></td>
                    <td class="font-bold">${item.tenNCC}</td>
                    <td>${item.diaChi}</td>
                    <td><span class="type-tag">${item.loaiHinh}</span></td>
                    <td><button class="action-btn delete" onclick="deleteItem('${item.maNCC}')"><i class="fas fa-trash"></i></button></td>
                </tr>`).join('');
        }
        function logout() { localStorage.removeItem('user'); window.location.href = 'login.html'; }
    </script>
</body>
</html>
