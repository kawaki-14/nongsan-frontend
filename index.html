<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Nông Sản Việt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1><i class="fas fa-leaf"></i> QUẢN LÝ NÔNG SẢN</h1>
            <p>Hệ thống truy xuất nguồn gốc dữ liệu thực</p>
        </header>

        <main>
            <div class="control-panel">
                <button id="fetchBtn" onclick="loadData()">
                    <i class="fas fa-sync-alt"></i> Tải dữ liệu từ Server
                </button>
            </div>

            <div class="search-box">
                <div class="input-group">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Tìm tên nông sản..." onkeyup="filterData()">
                </div>

                <div class="input-group">
                    <i class="fas fa-filter"></i>
                    <select id="filterLoai" onchange="filterData()">
                        <option value="">Tất cả loại</option>
                        <option value="Trái cây">Trái cây</option>
                        <option value="Rau củ">Rau củ</option>
                        <option value="Gia vị">Gia vị</option>
                        <option value="Thực phẩm tươi sống">Thực phẩm tươi sống</option>
                        <option value="Lương thực">Lương thực</option>
                        <option value="Đồ uống">Đồ uống</option>
                    </select>
                </div>

                <div class="button-group">
                    <button id="sortBtn" onclick="toggleSortPrice()" class="btn-tool">
                        <i class="fas fa-sort"></i> Giá
                    </button>
                    <button onclick="clearFilters()" class="btn-tool btn-clear" title="Xóa bộ lọc">
                        <i class="fas fa-eraser"></i>
                    </button>
                </div>
            </div>

            <div id="status-message" class="status">Sẵn sàng kết nối...</div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Mã Nông Sản</th>
                            <th>Tên Nông Sản</th>
                            <th>Loại</th>
                            <th>Số lượng</th>
                            <th>Giá (VNĐ)</th>
                            <th>Xuất Xứ</th>
                        </tr>
                    </thead>
                    <tbody id="data-content">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        let allData = []; // Lưu trữ dữ liệu gốc
        let isAscending = true; // Trạng thái sắp xếp giá

        async function loadData() {
            const status = document.getElementById('status-message');
            const btn = document.getElementById('fetchBtn');
            
            status.innerText = "⏳ Đang kết nối server Render...";
            status.className = "status loading";
            btn.disabled = true;

            try {
                const response = await fetch('https://demo-xo8t.onrender.com/api/nongsan/all');
                if (!response.ok) throw new Error("Lỗi Server");
                
                allData = await response.json();
                renderTable(allData);
                
                status.innerText = `✅ Đã hiển thị ${allData.length} sản phẩm.`;
                status.className = "status success";
            } catch (error) {
                status.innerText = "❌ Lỗi: Server đang ngủ hoặc sai link API!";
                status.className = "status error";
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('data-content');
            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Không tìm thấy sản phẩm phù hợp</td></tr>";
                return;
            }

            data.forEach(item => {
                const row = `<tr>
                    <td><span class="badge">${item.maNS}</span></td>
                    <td class="font-bold">${item.tenNS}</td>
                    <td>${item.loai || '---'}</td>
                    <td>${item.soLuong}</td>
                    <td class="text-green">${item.gia ? item.gia.toLocaleString() : 0} đ</td>
                    <td><i class="fas fa-map-marker-alt"></i> ${item.xuatXu}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function filterData() {
            const nameSearch = document.getElementById('searchInput').value.toLowerCase();
            const loaiFilter = document.getElementById('filterLoai').value;

            const filtered = allData.filter(item => {
                const matchesName = item.tenNS.toLowerCase().includes(nameSearch);
                const matchesLoai = loaiFilter === "" || item.loai === loaiFilter;
                return matchesName && matchesLoai;
            });

            renderTable(filtered);
            const status = document.getElementById('status-message');
            status.innerText = `🔍 Tìm thấy ${filtered.length} kết quả phù hợp.`;
        }

        // TÍNH NĂNG SẮP XẾP GIÁ
        function toggleSortPrice() {
            if (allData.length === 0) return;
            
            isAscending = !isAscending;
            const sortBtn = document.getElementById('sortBtn');

            allData.sort((a, b) => {
                return isAscending ? (a.gia - b.gia) : (b.gia - a.gia);
            });

            // Cập nhật giao diện nút
            sortBtn.innerHTML = isAscending 
                ? '<i class="fas fa-sort-amount-up"></i> Thấp - Cao' 
                : '<i class="fas fa-sort-amount-down"></i> Cao - Thấp';
            
            filterData(); // Sắp xếp xong thì lọc lại theo điều kiện hiện tại
        }

        // TÍNH NĂNG XÓA BỘ LỌC
        function clearFilters() {
            document.getElementById('searchInput').value = "";
            document.getElementById('filterLoai').value = "";
            document.getElementById('sortBtn').innerHTML = '<i class="fas fa-sort"></i> Giá';
            
            // Tải lại bảng gốc (giữ nguyên thứ tự ban đầu nếu muốn, hoặc giữ sort hiện tại)
            renderTable(allData);
            
            const status = document.getElementById('status-message');
            status.innerText = `✅ Đã xóa bộ lọc. Hiển thị tất cả ${allData.length} sản phẩm.`;
        }
    </script>
</body>
</html>
