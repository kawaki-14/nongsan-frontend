<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Nông Sản Việt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1><i class="fas fa-leaf"></i> QUẢN LÝ NÔNG SẢN</h1>
            <p>Hệ thống truy xuất nguồn gốc dữ liệu thực</p>
        </header>

        <main>
            <div class="control-panel">
                <button id="fetchBtn" onclick="loadData()">
                    <i class="fas fa-sync-alt"></i> Tải dữ liệu
                </button>
            </div>

            <div id="status-message" class="status">Sẵn sàng kết nối...</div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Mã Nông Sản</th>
                            <th>Tên Sản Phẩm</th>
                            <th>Xuất Xứ</th>
                        </tr>
                    </thead>
                    <tbody id="data-content">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        async function loadData() {
            const tbody = document.getElementById('data-content');
            const status = document.getElementById('status-message');
            const btn = document.getElementById('fetchBtn');

            // 1. Hiệu ứng khi đang tải
            status.innerText = "Đang kết nối server ...";
            status.className = "status loading";
            btn.disabled = true;
            tbody.innerHTML = "";

            try {
                // 2. Gọi API đến Render (Link)
                const response = await fetch('https://demo-xo8t.onrender.com/api/nongsan/all');
                
                if (!response.ok) throw new Error("Server trả về lỗi!");

                const data = await response.json();

                // 3. Hiển thị dữ liệu
                if (data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='3'>Không có dữ liệu trong DB</td></tr>";
                } else {
                    data.forEach(item => {
                        const row = `<tr>
                            <td><span class="badge">${item.maNS}</span></td>
                            <td class="font-bold">${item.tenNS}</td>
                            <td><i class="fas fa-map-marker-alt"></i> ${item.xuatXu}</td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                    status.innerText = `Đã tải ${data.length} sản phẩm thành công!`;
                    status.className = "status success";
                }
            } catch (error) {
                console.error(error);
                status.innerText = "Lỗi!";
                status.className = "status error";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
