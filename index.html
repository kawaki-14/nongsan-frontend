<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRI-ADMIN - Nông Sản</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('user'));
        if (!currentUser) window.location.href = 'login.html';
    </script>

    <div class="app-container">
        <nav class="side-nav">
            <div class="nav-logo"><i class="fas fa-seedling"></i><span>AGRI-ADMIN</span></div>
            <a href="index.html" class="active"><i class="fas fa-leaf"></i> Nông Sản</a>
            <a href="nhacungcap.html"><i class="fas fa-truck"></i> Nhà Cung Cấp</a>
            <a href="cungcap.html"><i class="fas fa-clipboard-list"></i> Nhập Hàng</a>
            <a href="#"><i class="fas fa-users"></i> Nhân Viên</a>
        </nav>

        <main>
            <header>
                <div class="header-main">
                    <h1>QUẢN LÝ NÔNG SẢN</h1>
                    <p>Hệ thống kho bãi và truy xuất nguồn gốc</p>
                </div>
                <div class="user-info-bar">
                    <div class="user-details">
                        <span class="user-name" id="display-name">---</span>
                        <span class="user-role" id="display-role">---</span>
                    </div>
                    <button class="btn-logout" onclick="logout()"><i class="fas fa-power-off"></i></button>
                </div>
            </header>

            <div class="control-panel">
                <button onclick="loadData()"><i class="fas fa-sync-alt"></i> Tải lại</button>
                <button onclick="openModal()"><i class="fas fa-plus-circle"></i> Thêm Nông Sản</button>
            </div>

            <div class="search-box">
                <div class="input-group">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Tìm tên nông sản..." onkeyup="filterData()">
                </div>
                <div class="input-group">
                    <i class="fas fa-filter"></i>
                    <select id="filterLoai" onchange="filterData()">
                        <option value="">Tất cả loại</option>
                        <option value="Trái cây">Trái cây</option>
                        <option value="Rau củ">Rau củ</option>
                        <option value="Lương thực">Lương thực</option>
                    </select>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Mã NS</th><th>Tên Nông Sản</th><th>Loại</th><th>Số lượng</th><th>Giá (VNĐ)</th><th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="data-content"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="crudModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm Nông Sản</h2>
            <input type="text" id="maNS" placeholder="Mã NS">
            <input type="text" id="tenNS" placeholder="Tên sản phẩm">
            <input type="text" id="loai" placeholder="Loại">
            <input type="number" id="soLuong" placeholder="Số lượng">
            <input type="number" id="gia" placeholder="Giá">
            <input type="text" id="xuatXu" placeholder="Xuất xứ">
            <div style="margin-top:20px">
                <button onclick="saveData()">Lưu</button>
                <button onclick="closeModal()" style="background:#475569">Hủy</button>
            </div>
        </div>
    </div>

    <script>
        const apiBase = "https://demo-xo8t.onrender.com/api/nongsan";
        let allData = [];

        window.onload = () => {
            document.getElementById('display-name').innerText = currentUser.hoTen;
            document.getElementById('display-role').innerText = currentUser.chucVu;
            loadData();
        };

        function logout() { localStorage.removeItem('user'); window.location.href = 'login.html'; }

        async function loadData() {
            const res = await fetch(`${apiBase}/all`);
            allData = await res.json();
            renderTable(allData);
        }

        function renderTable(data) {
            const tbody = document.getElementById('data-content');
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td><span class="badge">${item.maNS}</span></td>
                    <td class="font-bold">${item.tenNS}</td>
                    <td>${item.loai}</td>
                    <td>${item.soLuong}</td>
                    <td class="text-green">${item.gia.toLocaleString()} đ</td>
                    <td>
                        <button class="action-btn edit" onclick="editItem('${item.maNS}')"><i class="fas fa-edit"></i></button>
                        <button class="action-btn delete" onclick="deleteItem('${item.maNS}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`).join('');
        }

        function openModal() { document.getElementById('crudModal').style.display = "flex"; }
        function closeModal() { document.getElementById('crudModal').style.display = "none"; }
        
        function filterData() {
            const name = document.getElementById('searchInput').value.toLowerCase();
            const loai = document.getElementById('filterLoai').value;
            const filtered = allData.filter(i => i.tenNS.toLowerCase().includes(name) && (loai === "" || i.loai === loai));
            renderTable(filtered);
        }
    </script>
</body>
</html>
