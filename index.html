<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Nông Sản - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- SCRIPT KIỂM TRA ĐĂNG NHẬP (PHẢI ĐẶT Ở ĐẦU) -->
    <script>
        const currentUser = JSON.parse(localStorage.getItem('user'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }
    </script>

    <div class="app-container">
        <header>
            <div class="header-main">
                <h1><i class="fas fa-leaf"></i> QUẢN LÝ NÔNG SẢN</h1>
                <p>Hệ thống truy xuất nguồn gốc dữ liệu thực</p>
            </div>
            
            <!-- HIỂN THỊ THÔNG TIN NHÂN VIÊN -->
            <div class="user-info-bar">
                <div class="user-details">
                    <span class="user-name"><i class="fas fa-user-circle"></i> <span id="display-name">---</span></span>
                    <span class="user-role" id="display-role">---</span>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </button>
            </div>
        </header>

        <main>
            <div class="control-panel">
                <button id="fetchBtn" onclick="loadData()">
                    <i class="fas fa-sync-alt"></i> Tải dữ liệu
                </button>
                <button class="btn-tool btn-add" onclick="openModal()">
                    <i class="fas fa-plus-circle"></i> Thêm Nông Sản Mới
                </button>
            </div>

            <div class="search-box">
                <div class="input-group">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Tìm tên nông sản..." onkeyup="filterData()">
                </div>

                <div class="input-group">
                    <i class="fas fa-filter"></i>
                    <select id="filterLoai" onchange="filterData()">
                        <option value="">Tất cả loại</option>
                        <option value="Trái cây">Trái cây</option>
                        <option value="Rau củ">Rau củ</option>
                        <option value="Gia vị">Gia vị</option>
                        <option value="Thực phẩm tươi sống">Thực phẩm tươi sống</option>
                        <option value="Lương thực">Lương thực</option>
                        <option value="Đồ uống">Đồ uống</option>
                    </select>
                </div>

                <div class="button-group">
                    <button id="sortIDBtn" onclick="toggleSortID()" class="btn-tool">
                        <i class="fas fa-sort-alpha-down"></i> Mã
                    </button>
                    <button id="sortBtn" onclick="toggleSortPrice()" class="btn-tool">
                        <i class="fas fa-sort-numeric-down"></i> Giá
                    </button>
                    <button onclick="clearFilters()" class="btn-tool btn-clear" title="Xóa bộ lọc">
                        <i class="fas fa-eraser"></i>
                    </button>
                </div>
            </div>

            <div id="status-message" class="status">Sẵn sàng kết nối...</div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Mã NS</th>
                            <th>Tên Nông Sản</th>
                            <th>Loại</th>
                            <th>Số lượng</th>
                            <th>Giá (VNĐ)</th>
                            <th>Xuất Xứ</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="data-content"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL FORM (THÊM/SỬA) -->
    <div id="crudModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Thêm Nông Sản</h2>
            <div class="form-group">
                <label>Mã Nông Sản:</label>
                <input type="text" id="maNS" placeholder="Ví dụ: NS01">
                <label>Tên Nông Sản:</label>
                <input type="text" id="tenNS" placeholder="Tên sản phẩm">
                <label>Loại:</label>
                <input type="text" id="loai" placeholder="Ví dụ: Trái cây">
                <label>Số lượng:</label>
                <input type="number" id="soLuong" placeholder="0">
                <label>Giá tiền:</label>
                <input type="number" id="gia" placeholder="0">
                <label>Xuất xứ:</label>
                <input type="text" id="xuatXu" placeholder="Tỉnh thành">
            </div>
            <div class="modal-actions">
                <button onclick="saveData()" class="btn-save">Lưu lại</button>
                <button onclick="closeModal()" class="btn-cancel">Hủy bỏ</button>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let isAscending = true;
        let isIDAscending = true;
        let isEditMode = false;
        const apiBase = "https://demo-xo8t.onrender.com/api/nongsan";

        // HIỂN THỊ THÔNG TIN USER KHI LOAD TRANG
        window.onload = function() {
            if (currentUser) {
                document.getElementById('display-name').innerText = currentUser.hoTen;
                document.getElementById('display-role').innerText = currentUser.chucVu;
            }
            loadData();
        };

        function logout() {
            if(confirm("Bro muốn đăng xuất à?")) {
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            }
        }

        // --- CÁC HÀM CRUD & LOGIC (GIỮ NGUYÊN BẢN TRƯỚC) ---
        async function loadData() {
            const status = document.getElementById('status-message');
            const btn = document.getElementById('fetchBtn');
            status.innerText = "⏳ Đang kết nối server...";
            status.className = "status loading";
            btn.disabled = true;

            try {
                const response = await fetch(`${apiBase}/all`);
                if (!response.ok) throw new Error("Lỗi API");
                allData = await response.json();
                renderTable(allData);
                status.innerText = `✅ Đã tải ${allData.length} sản phẩm.`;
                status.className = "status success";
            } catch (error) {
                status.innerText = "❌ Không thể tải dữ liệu.";
                status.className = "status error";
            } finally {
                btn.disabled = false;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('data-content');
            tbody.innerHTML = "";
            data.forEach(item => {
                const row = `<tr>
                    <td><span class="badge">${item.maNS}</span></td>
                    <td class="font-bold">${item.tenNS}</td>
                    <td>${item.loai || '---'}</td>
                    <td>${item.soLuong}</td>
                    <td class="text-green">${item.gia ? item.gia.toLocaleString() : 0} đ</td>
                    <td>${item.xuatXu}</td>
                    <td>
                        <button class="action-btn edit" onclick="editItem('${item.maNS}')"><i class="fas fa-edit"></i></button>
                        <button class="action-btn delete" onclick="deleteItem('${item.maNS}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function openModal(edit = false) {
            isEditMode = edit;
            document.getElementById('modalTitle').innerText = edit ? "Cập Nhật Thông Tin" : "Thêm Nông Sản Mới";
            document.getElementById('maNS').disabled = edit;
            document.getElementById('crudModal').style.display = "flex";
            if (!edit) clearForm();
        }

        function closeModal() { document.getElementById('crudModal').style.display = "none"; }
        function clearForm() { ['maNS', 'tenNS', 'loai', 'soLuong', 'gia', 'xuatXu'].forEach(id => document.getElementById(id).value = ""); }

        async function saveData() {
            const payload = {
                maNS: document.getElementById('maNS').value,
                tenNS: document.getElementById('tenNS').value,
                loai: document.getElementById('loai').value,
                soLuong: parseInt(document.getElementById('soLuong').value) || 0,
                gia: parseFloat(document.getElementById('gia').value) || 0,
                xuatXu: document.getElementById('xuatXu').value
            };
            const method = isEditMode ? "PUT" : "POST";
            const url = isEditMode ? `${apiBase}/update/${payload.maNS}` : `${apiBase}/add`;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    alert("Thành công!");
                    closeModal();
                    loadData();
                } else {
                    alert("Lỗi: Mã đã tồn tại hoặc server từ chối!");
                }
            } catch (error) { alert("Lỗi kết nối!"); }
        }

        async function deleteItem(id) {
            if (confirm(`Xóa mã ${id}?`)) {
                try {
                    const response = await fetch(`${apiBase}/delete/${id}`, { method: "DELETE" });
                    if (response.ok) { loadData(); } 
                    else { alert("Lỗi Cascade: Hãy kiểm tra liên kết dữ liệu!"); }
                } catch (error) { alert("Lỗi kết nối!"); }
            }
        }

        function editItem(id) {
            const item = allData.find(i => i.maNS === id);
            if (item) {
                ['maNS', 'tenNS', 'loai', 'soLuong', 'gia', 'xuatXu'].forEach(key => {
                    document.getElementById(key).value = item[key];
                });
                openModal(true);
            }
        }

        function toggleSortID() {
            isIDAscending = !isIDAscending;
            allData.sort((a, b) => isIDAscending ? a.maNS.localeCompare(b.maNS) : b.maNS.localeCompare(a.maNS));
            renderTable(allData);
        }

        function toggleSortPrice() {
            isAscending = !isAscending;
            allData.sort((a, b) => isAscending ? (a.gia - b.gia) : (b.gia - a.gia));
            renderTable(allData);
        }

        function filterData() {
            const name = document.getElementById('searchInput').value.toLowerCase();
            const loai = document.getElementById('filterLoai').value;
            const filtered = allData.filter(i => i.tenNS.toLowerCase().includes(name) && (loai === "" || i.loai === loai));
            renderTable(filtered);
        }

        function clearFilters() {
            document.getElementById('searchInput').value = "";
            document.getElementById('filterLoai').value = "";
            loadData();
        }
    </script>
</body>
</html>
