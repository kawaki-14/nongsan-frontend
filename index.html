<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRI-ADMIN - Quản Lý Nông Sản</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Thêm CSS cảnh báo trực tiếp để bro đỡ phải sửa file style.css */
        .expired { background-color: #fee2e2 !important; color: #b91c1c !important; font-weight: bold; }
        .near-expiry { background-color: #fef3c7 !important; color: #92400e !important; font-weight: bold; }
        .btn-warning-hsd { background: #ea580c !important; color: white !important; }
        .btn-warning-hsd:hover { background: #c2410c !important; }
    </style>
</head>
<body>
    <script>
        const userStr = localStorage.getItem('user');
        if (!userStr) window.location.href = 'login.html';
        const currentUser = JSON.parse(userStr);
    </script>

    <div class="app-container">
        <nav class="side-nav">
            <div class="nav-logo"><i class="fas fa-seedling"></i><span>AGRI-ADMIN</span></div>
            <a href="index.html" class="active"><i class="fas fa-leaf"></i> Nông Sản</a>
            <a href="nhacungcap.html"><i class="fas fa-truck"></i> Nhà Cung Cấp</a>
            <a href="cungcap.html"><i class="fas fa-clipboard-list"></i> Nhập Hàng</a>
            <a href="nhanvien.html"><i class="fas fa-users"></i> Nhân Viên</a>
            <a href="vuvipham.html"><i class="fas fa-exclamation-triangle"></i> Vi Phạm</a>
        </nav>

        <main>
            <header>
                <div class="header-main">
                    <h1>QUẢN LÝ NÔNG SẢN</h1>
                    <p>Hệ thống truy xuất nguồn gốc và kiểm soát hạn sử dụng</p>
                </div>
                <div class="user-info-bar">
                    <div class="user-details">
                        <span class="user-name" id="display-name">---</span>
                        <span class="user-role" id="display-role">---</span>
                    </div>
                    <button class="btn-logout" onclick="logout()"><i class="fas fa-power-off"></i></button>
                </div>
            </header>

            <div class="control-panel">
                <button onclick="loadData()"><i class="fas fa-sync-alt"></i> Tải lại</button>
                <button class="btn-tool btn-add" onclick="openModal()"><i class="fas fa-plus-circle"></i> Thêm Mới</button>
                <button class="btn-tool btn-warning-hsd" onclick="filterSapHetHan()">
                    <i class="fas fa-hourglass-end"></i> Cảnh Báo Hạn
                </button>
            </div>

            <div class="search-box">
                <div class="input-group">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Tìm tên nông sản..." onkeyup="filterData()">
                </div>
                <div class="button-group">
                    <button id="sortIDBtn" onclick="toggleSortID()" class="btn-tool"><i class="fas fa-sort"></i> Mã</button>
                    <button id="sortPriceBtn" onclick="toggleSortPrice()" class="btn-tool"><i class="fas fa-sort"></i> Giá</button>
                </div>
            </div>

            <div id="status-message" class="status">Sẵn sàng...</div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Mã NS</th>
                            <th>Tên Nông Sản</th>
                            <th>Loại</th>
                            <th>Số lượng</th>
                            <th>Giá (VNĐ)</th>
                            <th>Hạn Sử Dụng</th>
                            <th style="width: 100px;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="data-content"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="crudModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Thông Tin Nông Sản</h2>
            <div class="form-group">
                <label>Mã Nông Sản:</label><input type="text" id="maNS">
                <label>Tên Nông Sản:</label><input type="text" id="tenNS">
                <label>Loại:</label>
                <select id="loai">
                    <option value="Trái cây">Trái cây</option>
                    <option value="Rau củ">Rau củ</option>
                    <option value="Lương thực">Lương thực</option>
                    <option value="Hải sản">Hải sản</option>
                </select>
                <label>Số lượng:</label><input type="number" id="soLuong">
                <label>Giá tiền:</label><input type="number" id="gia">
                <label>Xuất xứ:</label><input type="text" id="xuatXu">
                <label style="color: #e11d48; font-weight: bold;">Hạn Sử Dụng:</label>
                <input type="date" id="hsd">
            </div>
            <div class="modal-actions">
                <button onclick="saveData()">Lưu dữ liệu</button>
                <button onclick="closeModal()" style="background: #475569;">Đóng</button>
            </div>
        </div>
    </div>

    <script>
        const apiBase = "https://demo-xo8t.onrender.com/api/nongsan";
        let allData = [];
        let isEditMode = false;

        window.onload = function() {
            if(currentUser) {
                document.getElementById('display-name').innerText = currentUser.hoTen;
                document.getElementById('display-role').innerText = currentUser.chucVu;
            }
            loadData();
        };

        async function loadData() {
            try {
                const res = await fetch(`${apiBase}/all`);
                allData = await res.json();
                renderTable(allData);
            } catch (e) { document.getElementById('status-message').innerText = "❌ Lỗi kết nối!"; }
        }

        function renderTable(data) {
            const tbody = document.getElementById('data-content');
            const today = new Date();
            today.setHours(0,0,0,0); // Reset giờ để so sánh ngày chính xác

            tbody.innerHTML = data.map(item => {
                let hsdClass = "";
                let warningIcon = "";
                
                if (item.hsd) {
                    const hsdDate = new Date(item.hsd);
                    const diffTime = hsdDate - today;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    if (diffDays < 0) {
                        hsdClass = "expired";
                        warningIcon = '<i class="fas fa-skull-crossbones"></i> HẾT HẠN';
                    } else if (diffDays <= 7) {
                        hsdClass = "near-expiry";
                        warningIcon = '<i class="fas fa-exclamation-circle"></i> SẮP HẾT';
                    }
                }

                return `
                    <tr class="${hsdClass}">
                        <td><span class="badge">${item.maNS}</span></td>
                        <td class="font-bold">${item.tenNS}</td>
                        <td><span class="type-tag">${item.loai || '---'}</span></td>
                        <td>${item.soLuong}</td>
                        <td class="text-green">${item.gia?.toLocaleString()} đ</td>
                        <td>${item.hsd || '---'} <br> <small>${warningIcon}</small></td>
                        <td>
                            <button class="action-btn edit" onclick="editItem('${item.maNS}')"><i class="fas fa-edit"></i></button>
                            <button class="action-btn delete" onclick="deleteItem('${item.maNS}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            }).join('');
        }

        // Lọc nhanh những món sắp hết hạn hoặc đã hết hạn
        function filterSapHetHan() {
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const filtered = allData.filter(item => {
                if (!item.hsd) return false;
                const hsdDate = new Date(item.hsd);
                const diffDays = Math.ceil((hsdDate - today) / (1000 * 60 * 60 * 24));
                return diffDays <= 7; // Lấy đồ đã hết hạn và còn dưới 7 ngày
            });
            
            renderTable(filtered);
            document.getElementById('status-message').innerHTML = `⚠️ Tìm thấy ${filtered.length} mặt hàng cần xử lý gấp! <button onclick="loadData()" style="font-size: 0.7rem; padding: 2px 5px;">Xem tất cả</button>`;
            document.getElementById('status-message').className = "status error";
        }

        async function saveData() {
            const payload = {
                maNS: document.getElementById('maNS').value,
                tenNS: document.getElementById('tenNS').value,
                loai: document.getElementById('loai').value,
                soLuong: parseInt(document.getElementById('soLuong').value),
                gia: parseFloat(document.getElementById('gia').value),
                xuatXu: document.getElementById('xuatXu').value,
                hsd: document.getElementById('hsd').value // Lưu HSD
            };
            const method = isEditMode ? "PUT" : "POST";
            const url = isEditMode ? `${apiBase}/update/${payload.maNS}` : `${apiBase}/add`;

            const res = await fetch(url, {
                method: method,
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            });
            if(res.ok) { closeModal(); loadData(); }
        }

        function editItem(id) {
            const item = allData.find(i => i.maNS === id);
            if(item) {
                isEditMode = true;
                document.getElementById('maNS').value = item.maNS;
                document.getElementById('maNS').disabled = true;
                document.getElementById('tenNS').value = item.tenNS;
                document.getElementById('loai').value = item.loai;
                document.getElementById('soLuong').value = item.soLuong;
                document.getElementById('gia').value = item.gia;
                document.getElementById('xuatXu').value = item.xuatXu;
                document.getElementById('hsd').value = item.hsd; // Hiện HSD cũ
                document.getElementById('crudModal').style.display = "flex";
            }
        }

        function openModal() {
            isEditMode = false;
            document.getElementById('maNS').disabled = false;
            ['maNS', 'tenNS', 'soLuong', 'gia', 'xuatXu', 'hsd'].forEach(id => document.getElementById(id).value = "");
            document.getElementById('crudModal').style.display = "flex";
        }

        function closeModal() { document.getElementById('crudModal').style.display = "none"; }
        function logout() { localStorage.removeItem('user'); window.location.href = 'login.html'; }
        
        function filterData() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allData.filter(i => i.tenNS.toLowerCase().includes(val));
            renderTable(filtered);
        }
        
        function toggleSortPrice() {
            allData.sort((a, b) => a.gia - b.gia);
            renderTable(allData);
        }
        function toggleSortID() {
            allData.sort((a, b) => a.maNS.localeCompare(b.maNS));
            renderTable(allData);
        }
    </script>
</body>
</html>
