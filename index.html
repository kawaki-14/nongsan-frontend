<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Nông Sản Việt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1><i class="fas fa-leaf"></i> QUẢN LÝ NÔNG SẢN</h1>
            <p>Hệ thống truy xuất nguồn gốc dữ liệu thực</p>
        </header>

        <main>
            <div class="control-panel">
                <button id="fetchBtn" onclick="loadData()">
                    <i class="fas fa-sync-alt"></i> Tải dữ liệu
                </button>
            </div>

            <div id="status-message" class="status">Sẵn sàng kết nối...</div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Mã Nông Sản</th>
                            <th>Tên Nông Sản</th>
			    <th>Loại</th>
         		    <th>Số lượng</th>
      		            <th>Giá (VNĐ)</th>
       		            <th>Xuất Xứ</th>
                            <th>Xuất Xứ</th>
                        </tr>
                    </thead>
                    <tbody id="data-content">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        async function loadData() {
    const tbody = document.getElementById('data-content');
    const status = document.getElementById('status-message');
    
    status.innerText = "⏳ Đang tải dữ liệu...";
    tbody.innerHTML = "";

    try {
        const response = await fetch('https://demo-xo8t.onrender.com/api/nongsan/all');
        const data = await response.json();

        data.forEach(item => {
            const row = `<tr>
                <td><span class="badge">${item.maNS}</span></td>
                <td class="font-bold">${item.tenNS}</td>
                <td>${item.loai || 'Chưa phân loại'}</td>
                <td>${item.soLuong}</td>
                <td class="text-green">${item.gia.toLocaleString()} đ</td>
                <td><i class="fas fa-map-marker-alt"></i> ${item.xuatXu}</td>
            </tr>`;
            tbody.innerHTML += row;
        });

        status.innerText = `✅ Đã hiển thị ${data.length} sản phẩm.`;
    } catch (error) {
        status.innerText = "❌ Lỗi kết nối API!";
    }
}
    </script>
</body>
</html>
