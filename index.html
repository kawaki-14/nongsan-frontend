<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Nông Sản Việt - Quản Trị</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1><i class="fas fa-leaf"></i> QUẢN LÝ NÔNG SẢN</h1>
            <p>Hệ thống truy xuất nguồn gốc dữ liệu thực</p>
        </header>

        <main>
            <div class="control-panel">
                <button id="fetchBtn" onclick="loadData()">
                    <i class="fas fa-sync-alt"></i> Tải dữ liệu
                </button>
                <button class="btn-tool btn-add" onclick="openModal()">
                    <i class="fas fa-plus-circle"></i> Thêm Nông Sản Mới
                </button>
            </div>

            <div class="search-box">
                <div class="input-group">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Tìm tên nông sản..." onkeyup="filterData()">
                </div>

                <div class="input-group">
                    <i class="fas fa-filter"></i>
                    <select id="filterLoai" onchange="filterData()">
                        <option value="">Tất cả loại</option>
                        <option value="Trái cây">Trái cây</option>
                        <option value="Rau củ">Rau củ</option>
                        <option value="Gia vị">Gia vị</option>
                        <option value="Thực phẩm tươi sống">Thực phẩm tươi sống</option>
                        <option value="Lương thực">Lương thực</option>
                        <option value="Đồ uống">Đồ uống</option>
                    </select>
                </div>

                <div class="button-group">
                    <button id="sortBtn" onclick="toggleSortPrice()" class="btn-tool">
                        <i class="fas fa-sort"></i> Giá
                    </button>
                    <button onclick="clearFilters()" class="btn-tool btn-clear" title="Xóa bộ lọc">
                        <i class="fas fa-eraser"></i>
                    </button>
                </div>
            </div>

            <div id="status-message" class="status">Sẵn sàng kết nối...</div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Mã NS</th>
                            <th>Tên Nông Sản</th>
                            <th>Loại</th>
                            <th>Số lượng</th>
                            <th>Giá (VNĐ)</th>
                            <th>Xuất Xứ</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="data-content">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="crudModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Thêm Nông Sản</h2>
            <div class="form-group">
                <label>Mã Nông Sản:</label>
                <input type="text" id="maNS" placeholder="Ví dụ: NS01">
                <label>Tên Nông Sản:</label>
                <input type="text" id="tenNS" placeholder="Tên sản phẩm">
                <label>Loại:</label>
                <input type="text" id="loai" placeholder="Ví dụ: Trái cây">
                <label>Số lượng:</label>
                <input type="number" id="soLuong" placeholder="0">
                <label>Giá tiền:</label>
                <input type="number" id="gia" placeholder="0">
                <label>Xuất xứ:</label>
                <input type="text" id="xuatXu" placeholder="Tỉnh thành">
            </div>
            <div class="modal-actions">
                <button onclick="saveData()" class="btn-save">Lưu lại</button>
                <button onclick="closeModal()" class="btn-cancel">Hủy bỏ</button>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let isAscending = true;
        let isEditMode = false;
        const apiBase = "https://demo-xo8t.onrender.com/api/nongsan";

        // 1. TẢI DỮ LIỆU
        async function loadData() {
            const status = document.getElementById('status-message');
            const btn = document.getElementById('fetchBtn');
            status.innerText = "⏳ Đang kết nối server...";
            status.className = "status loading";
            btn.disabled = true;

            try {
                const response = await fetch(`${apiBase}/all`);
                if (!response.ok) throw new Error("Lỗi API");
                allData = await response.json();
                renderTable(allData);
                status.innerText = `✅ Đã tải ${allData.length} sản phẩm.`;
                status.className = "status success";
            } catch (error) {
                status.innerText = "❌ Không thể tải dữ liệu. Server đang ngủ!";
                status.className = "status error";
            } finally {
                btn.disabled = false;
            }
        }

        // 2. VẼ BẢNG
        function renderTable(data) {
            const tbody = document.getElementById('data-content');
            tbody.innerHTML = "";
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center">Trống</td></tr>';
                return;
            }
            data.forEach(item => {
                const row = `<tr>
                    <td><span class="badge">${item.maNS}</span></td>
                    <td class="font-bold">${item.tenNS}</td>
                    <td>${item.loai || '---'}</td>
                    <td>${item.soLuong}</td>
                    <td class="text-green">${item.gia ? item.gia.toLocaleString() : 0} đ</td>
                    <td>${item.xuatXu}</td>
                    <td>
                        <button class="action-btn edit" onclick="editItem('${item.maNS}')" title="Sửa"><i class="fas fa-edit"></i></button>
                        <button class="action-btn delete" onclick="deleteItem('${item.maNS}')" title="Xóa"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // 3. ĐIỀU KHIỂN MODAL
        function openModal(edit = false) {
            isEditMode = edit;
            document.getElementById('modalTitle').innerText = edit ? "Cập Nhật Thông Tin" : "Thêm Nông Sản Mới";
            document.getElementById('maNS').disabled = edit; // Không cho sửa Mã khi đang Edit
            document.getElementById('crudModal').style.display = "flex"; // Dùng flex để căn giữa
            if (!edit) clearForm();
        }

        function closeModal() {
            document.getElementById('crudModal').style.display = "none";
        }

        function clearForm() {
            ['maNS', 'tenNS', 'loai', 'soLuong', 'gia', 'xuatXu'].forEach(id => document.getElementById(id).value = "");
        }

        // 4. LƯU DỮ LIỆU (ADD & UPDATE)
        async function saveData() {
            const payload = {
                maNS: document.getElementById('maNS').value,
                tenNS: document.getElementById('tenNS').value,
                loai: document.getElementById('loai').value,
                soLuong: parseInt(document.getElementById('soLuong').value) || 0,
                gia: parseFloat(document.getElementById('gia').value) || 0,
                xuatXu: document.getElementById('xuatXu').value
            };

            if (!payload.maNS || !payload.tenNS) {
                alert("Vui lòng nhập Mã và Tên nông sản!");
                return;
            }

            const url = isEditMode ? `${apiBase}/update/${payload.maNS}` : `${apiBase}/add`;
            const method = isEditMode ? "PUT" : "POST";

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    alert("Thao tác thành công!");
                    closeModal();
                    loadData();
                } else {
                    alert("Lỗi server: Kiểm tra xem mã đã tồn tại chưa!");
                }
            } catch (error) {
                alert("Lỗi kết nối API!");
            }
        }

        // 5. XÓA NÔNG SẢN (FIXED)
        async function deleteItem(id) {
            if (confirm(`Bro có chắc muốn xóa mã ${id} không?`)) {
                try {
                    const response = await fetch(`${apiBase}/delete/${id}`, { method: "DELETE" });
                    if (response.ok) {
                        alert("Đã xóa!");
                        loadData();
                    } else {
                        alert("Xóa thất bại! Mã không tồn tại hoặc có lỗi liên kết dữ liệu.");
                    }
                } catch (error) {
                    alert("Lỗi kết nối khi xóa!");
                }
            }
        }

        // 6. CHUẨN BỊ SỬA
        function editItem(id) {
            const item = allData.find(i => i.maNS === id);
            if (item) {
                document.getElementById('maNS').value = item.maNS;
                document.getElementById('tenNS').value = item.tenNS;
                document.getElementById('loai').value = item.loai;
                document.getElementById('soLuong').value = item.soLuong;
                document.getElementById('gia').value = item.gia;
                document.getElementById('xuatXu').value = item.xuatXu;
                openModal(true);
            }
        }

        // 7. LỌC & SẮP XẾP
        function filterData() {
            const nameSearch = document.getElementById('searchInput').value.toLowerCase();
            const loaiFilter = document.getElementById('filterLoai').value;
            const filtered = allData.filter(item => {
                const matchesName = item.tenNS.toLowerCase().includes(nameSearch);
                const matchesLoai = loaiFilter === "" || item.loai === loaiFilter;
                return matchesName && matchesLoai;
            });
            renderTable(filtered);
        }

        function toggleSortPrice() {
            isAscending = !isAscending;
            allData.sort((a, b) => isAscending ? (a.gia - b.gia) : (b.gia - a.gia));
            document.getElementById('sortBtn').innerHTML = isAscending ? '<i class="fas fa-sort-amount-up"></i> Giá Thấp-Cao' : '<i class="fas fa-sort-amount-down"></i> Giá Cao-Thấp';
            filterData();
        }

        function clearFilters() {
            document.getElementById('searchInput').value = "";
            document.getElementById('filterLoai').value = "";
            renderTable(allData);
        }

        // Tải dữ liệu ngay khi mở web
        window.onload = loadData;
    </script>
</body>
</html>
