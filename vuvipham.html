<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRI-ADMIN - Quản Lý Vi Phạm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- GIAO DIỆN DARK DASHBOARD MỚI --- */
        
        /* Ô Thống kê màu tối, viền Emerald */
        .stat-card {
            background: #1e293b !important;
            color: #f8fafc !important;
            border: 1px solid #334155 !important;
            border-left: 5px solid #10b981 !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h3 { color: #94a3b8 !important; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card p { font-size: 1.6rem !important; color: #10b981 !important; font-weight: 800; margin-top: 8px; }

        /* Bộ lọc nâng cao tông màu Navy */
        .advanced-filter {
            background: #1e293b !important;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #334155;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .filter-group label { color: #94a3b8 !important; font-size: 0.8rem; margin-bottom: 8px; display: block; }
        .filter-group input, .filter-group select {
            background: #0f172a !important;
            color: #f1f5f9 !important;
            border: 1px solid #475569 !important;
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }
        .filter-group input:focus { border-color: #10b981; }

        /* Tag mức độ vi phạm kiểu Glassmorphism */
        .bg-red { 
            background-color: rgba(239, 68, 68, 0.15) !important; 
            color: #f87171 !important; 
            border: 1px solid rgba(239, 68, 68, 0.3) !important; 
        }
        .bg-orange { 
            background-color: rgba(245, 158, 11, 0.15) !important; 
            color: #fbbf24 !important; 
            border: 1px solid rgba(245, 158, 11, 0.3) !important; 
        }
        .bg-green { 
            background-color: rgba(16, 185, 129, 0.15) !important; 
            color: #34d399 !important; 
            border: 1px solid rgba(16, 185, 129, 0.3) !important; 
        }

        /* Badge mã vụ */
        .badge-dark {
            background: #334155 !important;
            color: #cbd5e1 !important;
            border: 1px solid #475569;
            font-family: monospace;
        }

        .text-sub { color: #94a3b8; font-size: 0.85rem; }
    </style>
</head>
<body>
    <script>
        const userStr = localStorage.getItem('user');
        if (!userStr) window.location.href = 'login.html';
        const currentUser = JSON.parse(userStr);
    </script>

    <div class="app-container">
        <nav class="side-nav">
            <div class="nav-logo"><i class="fas fa-seedling"></i><span>AGRI-ADMIN</span></div>
            <a href="index.html"><i class="fas fa-leaf"></i> Nông Sản</a>
            <a href="nhacungcap.html"><i class="fas fa-truck"></i> Nhà Cung Cấp</a>
            <a href="cungcap.html"><i class="fas fa-clipboard-list"></i> Nhập Hàng</a>
            <a href="nhanvien.html"><i class="fas fa-users"></i> Nhân Viên</a>
            <a href="vuvipham.html" class="active"><i class="fas fa-exclamation-triangle"></i> Vi Phạm</a>
        </nav>

        <main>
            <header>
                <div class="header-main">
                    <h1>QUẢN LÝ VI PHẠM</h1>
                    <p style="color: #94a3b8;">Giám sát chất lượng và xử lý sai phạm hệ thống</p>
                </div>
                <div class="user-info-bar">
                    <div class="user-details">
                        <span class="user-name" id="display-name">---</span>
                        <span class="user-role" id="display-role">---</span>
                    </div>
                    <button class="btn-logout" onclick="logout()"><i class="fas fa-power-off"></i></button>
                </div>
            </header>

            <div class="stats-container">
                <div class="stat-card">
                    <h3><i class="fas fa-shield-alt"></i> Tổng vụ vi phạm</h3>
                    <p id="stat-total">0</p>
                </div>
                <div class="stat-card" style="border-left-color: #f59e0b !important;">
                    <h3><i class="fas fa-map-marker-alt"></i> Điểm nóng</h3>
                    <p id="stat-top-region">---</p>
                </div>
                <div class="stat-card" style="border-left-color: #3b82f6 !important;">
                    <h3><i class="fas fa-chart-line"></i> Tháng cao điểm</h3>
                    <p id="stat-top-month">---</p>
                </div>
            </div>

            <div class="advanced-filter">
                <div class="filter-group">
                    <label>Mức độ:</label>
                    <select id="filterMucDo" onchange="applyFilters()">
                        <option value="">Tất cả</option>
                        <option value="Nhẹ">Nhẹ</option>
                        <option value="Trung bình">Trung bình</option>
                        <option value="Nghiêm trọng">Nghiêm trọng</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Khu vực/Xuất xứ:</label>
                    <input type="text" id="filterKhuVuc" placeholder="Ví dụ: Đà Lạt..." onkeyup="applyFilters()">
                </div>
                <div class="filter-group">
                    <label>Từ ngày:</label>
                    <input type="date" id="filterStart" onchange="applyFilters()">
                </div>
                <div class="filter-group">
                    <label>Đến ngày:</label>
                    <input type="date" id="filterEnd" onchange="applyFilters()">
                </div>
            </div>

            <div class="control-panel">
                <button onclick="loadData()"><i class="fas fa-sync-alt"></i> Làm mới</button>
                <button class="btn-tool btn-add" style="background: #10b981;" onclick="openModal()">
                    <i class="fas fa-plus-circle"></i> Tạo Báo Cáo
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Mã Vụ</th>
                            <th>Nội dung & Sản phẩm</th>
                            <th>Ngày Xảy Ra</th>
                            <th>Mức độ</th>
                            <th>Khu vực</th>
                            <th style="width: 100px;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="vvp-content"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="vvpModal" class="modal">
        <div class="modal-content" style="background: #1e293b; color: white; border: 1px solid #334155;">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Chi Tiết Sai Phạm</h2>
            <div class="form-group">
                <label>Mã Vụ:</label><input type="text" id="maVVP">
                <label>Tên Vụ Vi Phạm:</label><input type="text" id="tenVVP">
                <label>Ngày Xảy Ra:</label><input type="date" id="ngayXayRa">
                <label>Mức Độ:</label>
                <select id="mucDo">
                    <option value="Nhẹ">Nhẹ</option>
                    <option value="Trung bình">Trung bình</option>
                    <option value="Nghiêm trọng">Nghiêm trọng</option>
                </select>
                <label>Hình Thức Xử Lý:</label>
                <textarea id="hinhThucXuLy" rows="2" style="background: #0f172a; color: white; border: 1px solid #475569;"></textarea>
            </div>
            <div class="modal-actions">
                <button style="background: #10b981;" onclick="saveData()">Lưu dữ liệu</button>
                <button onclick="closeModal()" style="background: #475569;">Đóng</button>
            </div>
        </div>
    </div>

    <script>
        const apiBase = "https://demo-xo8t.onrender.com/api/vuvipham";
        let allVVP = [];
        let isEdit = false;

        window.onload = function() {
            if (currentUser) {
                document.getElementById('display-name').innerText = currentUser.hoTen;
                document.getElementById('display-role').innerText = currentUser.chucVu;
            }
            loadData();
        };

        async function loadData() {
            try {
                const res = await fetch(`${apiBase}/summary`); 
                allVVP = await res.json();
                renderTable(allVVP);
                updateStats(allVVP);
            } catch (e) { console.error("Lỗi server"); }
        }

        function renderTable(data) {
            document.getElementById('vvp-content').innerHTML = data.map(v => {
                let mudoClass = "bg-green";
                if(v.mucDo === "Nghiêm trọng") mudoClass = "bg-red";
                if(v.mucDo === "Trung bình") mudoClass = "bg-orange";

                return `
                    <tr>
                        <td><span class="badge badge-dark">${v.maVVP}</span></td>
                        <td>
                            <div class="font-bold">${v.tenVVP}</div>
                            <div class="text-sub">Sản phẩm: ${v.tenNS || '---'}</div>
                        </td>
                        <td>${v.ngayXayRa}</td>
                        <td><span class="type-tag ${mudoClass}">${v.mucDo || 'Nhẹ'}</span></td>
                        <td><i class="fas fa-map-marker-alt" style="color: #10b981"></i> ${v.xuatXu || 'Chưa rõ'}</td>
                        <td>
                            <button class="action-btn edit" onclick="editVVP('${v.maVVP}')"><i class="fas fa-edit"></i></button>
                            <button class="action-btn delete" onclick="deleteVVP('${v.maVVP}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            }).join('');
        }

        function applyFilters() {
            const mucDo = document.getElementById('filterMucDo').value;
            const khuVuc = document.getElementById('filterKhuVuc').value.toLowerCase();
            const start = document.getElementById('filterStart').value;
            const end = document.getElementById('filterEnd').value;

            const filtered = allVVP.filter(v => {
                const matchMucDo = mucDo === "" || v.mucDo === mucDo;
                const matchKhuVuc = (v.xuatXu || "").toLowerCase().includes(khuVuc);
                const matchTime = (!start || v.ngayXayRa >= start) && (!end || v.ngayXayRa <= end);
                return matchMucDo && matchKhuVuc && matchTime;
            });

            renderTable(filtered);
            updateStats(filtered);
        }

        function updateStats(data) {
            document.getElementById('stat-total').innerText = data.length;
            const regionCounts = {};
            data.forEach(v => { if(v.xuatXu) regionCounts[v.xuatXu] = (regionCounts[v.xuatXu] || 0) + 1; });
            let topRegion = Object.keys(regionCounts).reduce((a, b) => regionCounts[a] > regionCounts[b] ? a : b, "N/A");
            document.getElementById('stat-top-region').innerText = topRegion === "N/A" ? "---" : topRegion;

            const monthCounts = {};
            data.forEach(v => { 
                if(v.ngayXayRa) {
                    const m = v.ngayXayRa.substring(5, 7); 
                    monthCounts[m] = (monthCounts[m] || 0) + 1;
                }
            });
            let topMonth = Object.keys(monthCounts).reduce((a, b) => monthCounts[a] > monthCounts[b] ? a : b, "N/A");
            document.getElementById('stat-top-month').innerText = topMonth === "N/A" ? "---" : "Tháng " + topMonth;
        }

        async function saveData() {
            const payload = {
                maVVP: document.getElementById('maVVP').value,
                tenVVP: document.getElementById('tenVVP').value,
                ngayXayRa: document.getElementById('ngayXayRa').value,
                mucDo: document.getElementById('mucDo').value,
                hinhThucXuLy: document.getElementById('hinhThucXuLy').value
            };
            const method = isEdit ? "PUT" : "POST";
            const url = isEdit ? `${apiBase}/update/${payload.maVVP}` : `${apiBase}/add`;
            const res = await fetch(url, {
                method: method,
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            });
            if(res.ok) { closeModal(); loadData(); }
        }

        function editVVP(id) {
            const v = allVVP.find(x => x.maVVP === id);
            if(v) {
                isEdit = true;
                document.getElementById('maVVP').value = v.maVVP;
                document.getElementById('maVVP').disabled = true;
                document.getElementById('tenVVP').value = v.tenVVP;
                document.getElementById('ngayXayRa').value = v.ngayXayRa;
                document.getElementById('mucDo').value = v.mucDo || "Nhẹ";
                document.getElementById('hinhThucXuLy').value = v.hinhThucXuLy;
                document.getElementById('vvpModal').style.display = "flex";
            }
        }

        async function deleteVVP(id) {
            if(confirm(`Xác nhận xóa vụ vi phạm ${id}?`)) {
                await fetch(`${apiBase}/delete/${id}`, { method: "DELETE" });
                loadData();
            }
        }

        function openModal() {
            isEdit = false;
            document.getElementById('maVVP').disabled = false;
            ['maVVP', 'tenVVP', 'ngayXayRa', 'hinhThucXuLy'].forEach(id => document.getElementById(id).value = "");
            document.getElementById('vvpModal').style.display = "flex";
        }
        function closeModal() { document.getElementById('vvpModal').style.display = "none"; }
        function logout() { localStorage.removeItem('user'); window.location.href = 'login.html'; }
    </script>
</body>
</html>
